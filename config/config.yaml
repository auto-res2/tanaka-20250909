hardware:
  backend: nccl
  gpus: 8
  gpu_type: A100-80GB
  mixed_precision: bf16
seeds:
- 13
- 17
- 23
datasets:
  ogbn-products:
    url: https://snap.stanford.edu/ogb/data/nodeproppred/products.zip
    batch_size: 2048
    val_acc_target: 0.78
  ogbn-papers100M:
    url: https://snap.stanford.edu/ogb/data/nodeproppred/papers100M-bin.zip
    batch_size: 1024
    val_acc_target: 0.71
  reddit:
    url: https://data.dgl.ai/dataset/reddit.zip
    batch_size: 2048
    val_acc_target: 0.96
  flickr:
    url: https://data.dgl.ai/dataset/flickr.zip
    batch_size: 2048
    val_acc_target: 0.5
model:
  in_dim: 128
  hidden_dim: 128
  heads: 8
  num_layers: 3
flashgat:
  B: 32
  score_decay: 0.9
  causal: false
optim:
  lr: 0.002
  lr_6l: 0.001
  weight_decay: 0.0001
  epochs: 20
